media:
  - name: gallery
    label: Gallery Photos
    input: assets/gallery
    output: assets/gallery
    categories: [image]
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: covers
    label: Cover Artwork
    input: assets/covers
    output: assets/covers
    categories: [image]
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: audio
    label: Audio Previews
    input: assets/audio
    output: assets/audio
    categories: [audio]
    extensions: [mp3, m4a, wav]
    rename: safe
  - name: documents
    label: PDFs & Documents
    input: assets/documents
    output: assets/documents
    categories: [document]
    extensions: [pdf]
    rename: safe
  - name: legacy
    label: Existing Assets (legacy)
    input: assets
    output: assets

content:
  - name: content
    label: Site Content
    type: file
    path: content.json
    fields:
      # ---------- Contact & global links ----------
      - { name: bookingEmail, label: "Booking / general email", type: string }
      - { name: beatEmail, label: "Beat inquiries email", type: string }
      - { name: magEmail, label: "SOTA Mag submissions email", type: string }
      - { name: managementEmail, label: "Management email (optional)", type: string }
      - { name: phone, label: "Phone (optional)", type: string }
      - { name: city, label: "Based in", type: string }
      - { name: formEndpoint, label: "Booking form endpoint (optional, Formspree)", type: string }
      - { name: spotifyEmbed, label: "Music page: Spotify artist embed URL", type: string }
      - { name: facebook, label: "Facebook URL", type: string }
      - { name: unitedmasters, label: "UnitedMasters (all links) URL", type: string }
      - { name: sotaMag, label: "SOTA Mag Instagram URL", type: string }
      - name: socials
        label: "Social links (header & footer icons)"
        type: object
        fields:
          - { name: instagram, label: Instagram, type: string }
          - { name: twitter, label: "X / Twitter", type: string }
          - { name: tiktok, label: TikTok, type: string }
          - { name: youtube, label: YouTube, type: string }
          - { name: spotify, label: Spotify, type: string }
          - { name: appleMusic, label: Apple Music, type: string }
          - { name: soundcloud, label: SoundCloud, type: string }
          - { name: beatstars, label: BeatStars, type: string }
      - name: streaming
        label: "Music page: Listen-everywhere buttons"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - { name: label, label: Button label, type: string }
          - { name: url, label: Link, type: string }

      # ---------- Music releases ----------
      - name: releases
        label: Music releases
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} · {year}"
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: year, label: Year, type: string, required: true }
          - { name: type, label: "Type (Single / EP / Album)", type: string, required: true }
          - name: cover
            label: "Cover image (optional)"
            type: image
            options:
              media: covers
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - { name: hue, label: "Color seed 0-360 (fallback art)", type: number }
          - name: links
            label: Platform links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - { name: label, label: Platform, type: string }
              - { name: url, label: Link, type: string }

      # ---------- Beats ----------
      - name: services
        label: "Production Services (rate card on Beats page)"
        type: object
        fields:
          - { name: email, label: "Inquiries email", type: string }
          - { name: intro, label: Intro line, type: text }
          - name: items
            label: Services
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name} · {price}"
            fields:
              - { name: name, label: Service, type: string }
              - { name: price, label: Price, type: string }
          - name: bundles
            label: Bundle packages
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name} · {price}"
            fields:
              - { name: name, label: Bundle, type: string }
              - { name: price, label: Price, type: string }
      - name: licensing
        label: "License tiers (shown on every beat)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} · ${price}"
        fields:
          - { name: name, label: Tier name, type: string }
          - { name: price, label: "Price ($)", type: number }
          - { name: includes, label: "What's included", type: string }
      - name: beats
        label: Beats for sale
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} · {bpm} BPM"
        fields:
          - { name: title, label: Title, type: string }
          - { name: bpm, label: BPM, type: number }
          - { name: key, label: Key, type: string }
          - { name: price, label: "Starting price ($)", type: number }
          - { name: tags, label: Tags, type: string, list: true }
          - { name: beatstars, label: "BeatStars link (this beat)", type: string }
          - { name: stripe, label: "Buy-here link (Stripe Payment Link)", type: string }
          - name: preview
            label: "Preview audio (MP3 recommended)"
            type: file
            options:
              media: audio
              extensions: [mp3, m4a, wav]
              rename: safe
          - name: contract
            label: "License agreement (PDF)"
            type: file
            options:
              media: documents
              extensions: [pdf]
              rename: safe

      # ---------- Shows ----------
      - name: shows
        label: "Shows (upcoming & past — sorted automatically by date)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{date} · {venue} · {city}"
        fields:
          - { name: date, label: Date, type: date, required: true }
          - { name: venue, label: Venue, type: string, required: true }
          - { name: city, label: City, type: string, required: true }
          - { name: badge, label: "Badge (Headline / Support / Festival)", type: string }
          - { name: tickets, label: Tickets link, type: string }

      # ---------- Podcast ----------
      - name: podcast
        label: "Podcast (Sota Tired)"
        type: object
        fields:
          - { name: spotifyShowEmbed, label: "Spotify show embed URL (plays episodes on-page)", type: string }
          - name: subscribe
            label: Subscribe buttons
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - { name: label, label: Label, type: string }
              - { name: url, label: Link, type: string }
          - name: episodes
            label: Episodes
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "Episode {n} · {title}"
            fields:
              - { name: n, label: "Episode #", type: number }
              - { name: title, label: Title, type: string }
              - { name: date, label: Date, type: date }
              - { name: dur, label: "Duration (e.g. 58:40)", type: string }
              - { name: desc, label: Description, type: text }
              - name: audio
                label: "Audio file (optional)"
                type: file
                options:
                  media: audio
                  extensions: [mp3, m4a]
                  rename: safe

      # ---------- Media gallery ----------
      - name: photos
        label: "Gallery: Photos"
        description: "Upload web-sized 4:5 images. The list order is the website display order."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{index} · {cap}"
        fields:
          - name: image
            label: Photo
            type: image
            description: "JPG, PNG, or WebP. Use a 4:5 crop and keep the file under 1 MB. Replace placeholder entries as photos become available."
            options:
              media: gallery
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: cap
            label: Caption / image description
            type: string
            required: true
            description: "Recommended: EVENT · CITY, STATE · MONTH YEAR"
          - { name: hue, label: "Fallback color (use 205)", type: number }
      - name: videos
        label: "Gallery: Videos"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{index} · {cap}"
        fields:
          - { name: cap, label: Title, type: string, required: true }
          - { name: url, label: "YouTube or Vimeo link", type: string, required: true }
          - { name: hue, label: "Fallback color (use 205)", type: number }

      # ---------- SOTA Mag ----------
      - name: sotamag
        label: SOTA Mag
        type: object
        fields:
          - { name: instagram, label: Instagram URL, type: string }
          - name: submit
            label: "Get-featured / submission page"
            type: object
            fields:
              - { name: intro, label: Intro line, type: text }
              - { name: formUrl, label: "Submission form link (share URL — opens in new tab)", type: string }
              - { name: note, label: "Pricing note", type: text }
              - name: tiers
                label: Feature tiers
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{name} · {price}"
                fields:
                  - { name: name, label: Tier name, type: string }
                  - { name: price, label: "Price (e.g. Starting at $55)", type: string }
                  - { name: note, label: Note, type: string }
              - { name: included, label: "What's included", type: string, list: true }
              - { name: requirements, label: Requirements, type: string, list: true }
          - { name: tagline, label: Tagline, type: string }
          - name: issues
            label: Issues
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title} · {date}"
            fields:
              - { name: title, label: Title, type: string }
              - { name: date, label: "Date (YYYY-MM)", type: string }
              - { name: blurb, label: Short blurb, type: string }
              - { name: caption, label: Caption, type: text }
              - name: cover
                label: "Cover image"
                type: image
                options:
                  media: covers
                  extensions: [jpg, jpeg, png, webp]
                  rename: safe
              - name: pdf
                label: "Issue PDF (flips page-by-page)"
                type: file
                options:
                  media: documents
                  extensions: [pdf]
                  rename: safe
              - name: pages
                label: "OR page images (instead of a PDF)"
                type: image
                list: true
                options:
                  media: covers
                  extensions: [jpg, jpeg, png, webp]
                  rename: safe
              - { name: transcript, label: "Transcript (shows under the pages)", type: text }
              - { name: hue, label: "Color seed (fallback)", type: number }

      # ---------- Live Music Reviews ----------
      - name: faq
        label: "FAQ (SOTA Mag + Beats)"
        type: object
        fields:
          - name: mag
            label: "SOTA Mag FAQ"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{q}"
            fields:
              - { name: q, label: Question, type: string }
              - { name: a, label: Answer, type: text }
          - name: beats
            label: "Beats & Production FAQ"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{q}"
            fields:
              - { name: q, label: Question, type: string }
              - { name: a, label: Answer, type: text }
      - name: reviews
        label: Live Music Reviews
        type: object
        fields:
          - { name: twitch, label: Twitch channel URL, type: string }
          - { name: tiktok, label: TikTok URL, type: string }
          - { name: tagline, label: Tagline, type: string }
          - name: nero
            label: "Nero.fan submission banner"
            type: object
            fields:
              - { name: enabled, label: "Show banner", type: boolean }
              - { name: url, label: "Submission link (nero.fan/...)", type: string }
              - { name: handle, label: "Display text (e.g. NERO.FAN/TRAPPSOTA)", type: string }
          - name: items
            label: Review entries
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title} · {platform}"
            fields:
              - { name: title, label: Title, type: string }
              - { name: platform, label: "Platform (Twitch / TikTok)", type: string }
              - { name: url, label: Link, type: string }
              - { name: note, label: Note, type: string }
              - { name: hue, label: "Color seed", type: number }
